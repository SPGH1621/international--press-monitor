name: Daily press monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:00 Tehran = 04:30 UTC (Iran currently observes UTC+03:30)
    - cron: "30 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: press-monitor-pages
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch Telegram metadata
        run: python scanner.py
      - name: Save metadata back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram issue index"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
